name: Build Baptista Brain Android APK
on:
  push:
    branches: [baptista-brain-build]
    paths:
      - '.github/workflows/baptista-brain-apk.yml'
      - 'app/**'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify question and gameplay core
        run: node tests/smoke.cjs
      - name: Compile offline APK
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Zipalign and prepare signing tools
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/BaptistaBrain_v1_unsigned_aligned.apk
          "$BT/zipalign" -c -p 4 dist/BaptistaBrain_v1_unsigned_aligned.apk
          "$BT/aapt2" dump badging dist/BaptistaBrain_v1_unsigned_aligned.apk | head -15
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: baptista-brain-android-build
          path: dist/
          retention-days: 7
          if-no-files-found: error
