name: OFA · publish verified public brainstem source
on:
  push:
    branches: [main]
    paths:
      - 'ofa/*.gz'
      - '.github/workflows/ofa-bootstrap.yml'
permissions:
  contents: write
concurrency:
  group: ofa-initial-source-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract tested, generic source without credentials
        run: |
          set -euo pipefail
          echo 'f02d9642ecc7372e1acd69ae5800b3b49677a4589e67afc812369196cecdecf6  ofa/brainstem.py.gz' | sha256sum --check
          echo 'b80d8e51d4e5fa9ad9dea71ff9f3462d80711af2af540b84683a20d79f30995c  tests/test_brainstem.py.gz' | sha256sum --check
          gzip -dc ofa/brainstem.py.gz > ofa/brainstem.py
          gzip -dc tests/test_brainstem.py.gz > tests/test_brainstem.py
          echo '0c57b61a1991250c7af9cecfb178a87d7e07a067fdc7003da90440481bb8f31e  ofa/brainstem.py' | sha256sum --check
          echo '5cfae69f2921f43ee279161c3219ecc2d05083ca74847dd43ad1e898ae0b156b  tests/test_brainstem.py' | sha256sum --check
          python -m unittest discover -s tests -p test_brainstem.py -v
      - name: Commit readable, verified, public-safe sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ofa/brainstem.py tests/test_brainstem.py
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified OFA Brainstem v0.1 public sources [skip ci]'
            git push origin HEAD:main
          fi
