name: Build Pocket HQ offline Android shell
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile with official Android Gradle Plugin and D8
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify package and export unsigned APK and standard signing tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/PocketHQ_aligned_unsigned.apk
          "$BT/zipalign" -c -p 4 dist/PocketHQ_aligned_unsigned.apk
          "$BT/aapt2" dump badging dist/PocketHQ_aligned_unsigned.apk
          cp "$BT/zipalign" dist/zipalign
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          mkdir -p dist/lib64
          if [ -f "$BT/lib64/libc++.so" ]; then
            cp "$BT/lib64/libc++.so" dist/lib64/libc++.so
          else
            echo "zipalign runtime dependency libc++.so was not found" >&2
            exit 1
          fi
          sha256sum dist/PocketHQ_aligned_unsigned.apk dist/zipalign dist/apksigner.jar dist/lib64/libc++.so > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pockethq-standard-unsigned-build
          path: dist/
          retention-days: 1
          if-no-files-found: error
