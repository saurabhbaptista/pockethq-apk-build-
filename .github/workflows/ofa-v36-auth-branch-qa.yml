name: OFA v3.6 Auth Branch QA
on:
  push:
    branches: [ofa-v36-auth-session-polish-20261006]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated auth branch
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify package identity
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 2
