name: OFA v3.6 Auth Branch QA
on:
  push:
    branches: [ofa-v36-auth-session-polish-20261006]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@035682743ab223ec9c6169af09811dff8247e520
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile isolated auth branch
        run: gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify package identity and stage unsigned private-injection payload
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/34.0.0"
          "$BT/aapt2" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | head -n 2
          mkdir -p dist/lib64
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk dist/OFA_v3_6_shell_aligned_unsigned.apk
          "$BT/zipalign" -c -p 4 dist/OFA_v3_6_shell_aligned_unsigned.apk
          cp "$BT/zipalign" dist/zipalign
          cp "$BT/lib/apksigner.jar" dist/apksigner.jar
          cp "$BT/lib64/libc++.so" dist/lib64/libc++.so
          sha256sum dist/OFA_v3_6_shell_aligned_unsigned.apk dist/zipalign dist/apksigner.jar dist/lib64/libc++.so > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ofa-v36-private-injection-payload
          path: dist/
          retention-days: 1
          if-no-files-found: error
