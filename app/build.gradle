plugins { id 'com.android.application' }
android {
 namespace 'com.pocketproject.hq'
 compileSdk 34
 defaultConfig {
   applicationId 'com.pocketproject.hq'
   minSdk 26
   targetSdk 34
   versionCode 26
   versionName '3.8.2-nano-async-rc'
 }
 compileOptions {
   sourceCompatibility JavaVersion.VERSION_1_8
   targetCompatibility JavaVersion.VERSION_1_8
 }
 buildTypes {
   release { minifyEnabled false }
   debug { minifyEnabled false }
 }
}

// Private on-device inference uses AICore; no paid model service or API key.
dependencies {
    implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4'
}
